[package]
name = "rmerge-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "rmerge"
path = "src/main.rs"

[dependencies]
rmerge-domain = { path = "../rmerge-domain" }
rmerge-application = { path = "../rmerge-application" }
rmerge-infrastructure = { path = "../rmerge-infrastructure" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
