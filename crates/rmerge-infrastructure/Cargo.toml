[package]
name = "rmerge-infrastructure"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rmerge-domain = { path = "../rmerge-domain" }
rmerge-application = { path = "../rmerge-application" }
git2 = { version = "0.20", features = ["vendored-openssl", "vendored-libgit2"] }
font-kit = "0.14"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
interprocess = "2.2"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
similar = { version = "2.6", features = ["inline"] }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"
