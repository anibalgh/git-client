<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#0a0c0f"/>
    </linearGradient>

    <!-- Branch Glow Effects -->
    <filter id="neon-glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Linear Gradients for strokes -->
    <linearGradient id="cyan-stem" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="orange-branch" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Completely Square Background (No rounded corners, sharp 90 deg) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg-grad)"/>

  <!-- Subtle Minimal Geometric Accent Lines -->
  <line x1="0" y1="128" x2="512" y2="128" stroke="#1f242d" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="0" y1="256" x2="512" y2="256" stroke="#1f242d" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="0" y1="384" x2="512" y2="384" stroke="#1f242d" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="192" y1="0" x2="192" y2="512" stroke="#1f242d" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="336" y1="0" x2="336" y2="512" stroke="#1f242d" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Git Branch (Orange Fork and Re-join) -->
  <path d="M 192 384 C 270 384 336 320 336 220 L 336 170" 
        fill="none" stroke="url(#orange-branch)" stroke-width="26" stroke-linecap="round" filter="url(#neon-glow-orange)"/>

  <!-- Git Fork Connector from Middle Node -->
  <line x1="192" y1="256" x2="295" y2="188"
        stroke="url(#orange-branch)" stroke-width="24" stroke-linecap="round" filter="url(#neon-glow-orange)"/>

  <!-- Git Main Trunk (Cyan Line) -->
  <line x1="192" y1="384" x2="192" y2="128" 
        stroke="url(#cyan-stem)" stroke-width="26" stroke-linecap="round" filter="url(#neon-glow-cyan)"/>

  <!-- Commit Nodes (Trunk - Cyan) -->
  <!-- Bottom commit node -->
  <circle cx="192" cy="384" r="30" fill="#0d1117" stroke="#38bdf8" stroke-width="14" filter="url(#neon-glow-cyan)"/>
  <circle cx="192" cy="384" r="12" fill="#38bdf8"/>

  <!-- Middle commit node -->
  <circle cx="192" cy="256" r="30" fill="#0d1117" stroke="#38bdf8" stroke-width="14" filter="url(#neon-glow-cyan)"/>
  <circle cx="192" cy="256" r="12" fill="#38bdf8"/>

  <!-- Top commit node -->
  <circle cx="192" cy="128" r="30" fill="#0d1117" stroke="#38bdf8" stroke-width="14" filter="url(#neon-glow-cyan)"/>
  <circle cx="192" cy="128" r="12" fill="#38bdf8"/>

  <!-- Branch Commit Node (Orange) -->
  <circle cx="336" cy="170" r="30" fill="#0d1117" stroke="#f97316" stroke-width="14" filter="url(#neon-glow-orange)"/>
  <circle cx="336" cy="170" r="12" fill="#f97316"/>
</svg>
