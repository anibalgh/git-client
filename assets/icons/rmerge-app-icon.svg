<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#0e1015"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#48cae4"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <linearGradient id="trunk-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="#2d3342" stroke-width="6"/>

  <!-- Left Branch (Cyan) -->
  <path d="M 120 280 L 170 280 L 220 220 L 256 220" 
        fill="none" stroke="url(#cyan-glow)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="120" cy="280" r="18" fill="#48cae4"/>

  <!-- Right Branch (Amber) -->
  <path d="M 392 280 L 342 280 L 292 220 L 256 220" 
        fill="none" stroke="url(#amber-glow)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="392" cy="280" r="18" fill="#fb8500"/>

  <!-- Central Trunk (Merged Stem and Arrow) -->
  <line x1="256" y1="380" x2="256" y2="130" stroke="url(#trunk-grad)" stroke-width="30" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="256,80 216,150 296,150" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="256" cy="80" r="12" fill="#38bdf8"/>

  <!-- Brand Typography -->
  <text x="256" y="445" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="52" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="3">rmerge</text>
</svg>
